name: release

# 打 tag v* 就發版：六個平台的 ai-security-monitor 執行檔＋SHA256SUMS＋安裝腳本、GHCR 的 Hub 映像（amd64／arm64，含 -slim），
# 以及桌面版安裝檔 AI-Security-Monitor-<ver>-*（Windows NSIS、macOS arm64／x64 dmg、Linux AppImage／deb；未做程式碼簽章）。
# 桌面版自動更新：用 secrets TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) 的 minisign 金鑰簽更新檔（NSIS、.app.tar.gz、AppImage），
# scripts/updater-manifest.mjs 用 tauri.conf.json 的公鑰驗章後產生 latest.json（App 讀 releases/latest/download/latest.json）。
# 改名過渡：另附同內容的 asa-<ver>-<平台> 給 0.1.x 的 asa self-update；映像同時推新名與舊名 ai-security-agent-hub。
# 手動執行（workflow_dispatch）預設 dry_run：全部建置但不推映像、不建立 Release。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but do not publish
        type: boolean
        default: true

# 預設只讀；推映像的 job 才有 packages: write、建 Release 的 job 才有 contents: write
# （cargo build.rs、npm 安裝腳本跑在只讀 token 的 job 裡）
permissions:
  contents: read

env:
  IMAGE: ghcr.io/markku636/ai-security-monitor-hub
  DNS_IMAGE: ghcr.io/markku636/ai-security-monitor-dns
  LEGACY_IMAGE: ghcr.io/markku636/ai-security-agent-hub
  DOCKER_BUILD_RECORD_UPLOAD: false
  PUBLISH: ${{ github.event_name == 'push' || !inputs.dry_run }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            node scripts/check-version.mjs "$V"
          else
            V=$(node -p "require('./hub/package.json').version")
            node scripts/check-version.mjs "$V" --no-changelog
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  agent:
    needs: verify
    name: agent (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: windows-x64.exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, asset: windows-arm64.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: macos-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: linux-x64, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: linux-arm64, musl: true }
    defaults:
      run:
        shell: bash
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and smoke test
        run: |
          set -euo pipefail
          EXT=""; case "${{ matrix.target }}" in *windows*) EXT=".exe" ;; esac
          OUT="../dist/ai-security-monitor-${{ needs.verify.outputs.version }}-${{ matrix.asset }}"
          mkdir -p ../dist
          cp "target/${{ matrix.target }}/release/ai-security-monitor$EXT" "$OUT"
          # 0.1.x 的 asa self-update 找 asa-<ver>-<平台>：附一份同內容的別名
          cp "$OUT" "../dist/asa-${{ needs.verify.outputs.version }}-${{ matrix.asset }}"
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$HOST" = "${{ matrix.target }}" ] || [ "${{ matrix.musl }}" = "true" ]; then
            "$OUT" version | grep -q "^ai-security-monitor ${{ needs.verify.outputs.version }} "
            "$OUT" --json version | grep -Eq '"version": ?"${{ needs.verify.outputs.version }}"'
          fi
          ls -l ../dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  desktop:
    needs: verify
    name: desktop (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis, asset: windows-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: 'app,dmg', asset: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, bundles: 'app,dmg', asset: macos-x64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'appimage,deb', asset: linux-x64 }
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}
      - name: Linux build deps (Tauri 2 prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file build-essential
      - run: npm ci
      - name: Build installer and signed updater artifacts
        env:
          # 更新檔的 minisign 簽章（不是作業系統的程式碼簽章）；私鑰只放在 GitHub secrets
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set"; exit 1; }
          npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
      - name: Package
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          B="src-tauri/target/${{ matrix.target }}/release/bundle"
          ls -lR "$B" | grep -Ei '\.(exe|dmg|appimage|deb|tar\.gz|sig)$' || true
          mkdir -p ../dist
          one() { local f; f=$(find "$B/$1" -maxdepth 1 -type f -name "$2" | head -n 1); test -n "$f" || { echo "no $2 in $B/$1"; exit 1; }; cp "$f" "../dist/$3"; }
          # 選用：有就複製（.deb 的更新簽章看 bundler 版本）
          maybe() { local f; f=$(find "$B/$1" -maxdepth 1 -type f -name "$2" | head -n 1); if [ -n "$f" ]; then cp "$f" "../dist/$3"; fi; }
          case "${{ matrix.asset }}" in
            windows-x64)
              one nsis '*-setup.exe' "AI-Security-Monitor-$V-windows-x64-setup.exe"
              one nsis '*-setup.exe.sig' "AI-Security-Monitor-$V-windows-x64-setup.exe.sig"
              ;;
            macos-*)
              # 沒有 Apple 開發者憑證，用 ad-hoc 簽章（tauri.conf.json signingIdentity "-"）：整個 .app 簽好、結構完整，
              # Apple Silicon 上才不會顯示「已損毀」，而是可以在「隱私權與安全性」按「強制打開」
              app=$(find "$B/macos" -maxdepth 1 -name "*.app" | head -n 1)
              codesign --verify --deep --strict --verbose=2 "$app"
              # 不用 `tee | grep -q`：grep 找到後會提早關閉 pipe，較長的 arm64
              # codesign 輸出會讓 tee 收到 SIGPIPE，配合 pipefail 反而誤判失敗。
              signature=$(codesign -dv "$app" 2>&1)
              printf '%s\n' "$signature"
              grep -q "Signature=adhoc" <<<"$signature"
              one dmg '*.dmg' "AI-Security-Monitor-$V-${{ matrix.asset }}.dmg"
              one macos '*.app.tar.gz' "AI-Security-Monitor-$V-${{ matrix.asset }}.app.tar.gz"
              one macos '*.app.tar.gz.sig' "AI-Security-Monitor-$V-${{ matrix.asset }}.app.tar.gz.sig"
              ;;
            linux-x64)
              one appimage '*.AppImage' "AI-Security-Monitor-$V-linux-x64.AppImage"
              one appimage '*.AppImage.sig' "AI-Security-Monitor-$V-linux-x64.AppImage.sig"
              one deb '*.deb' "AI-Security-Monitor-$V-linux-amd64.deb"
              maybe deb '*.deb.sig' "AI-Security-Monitor-$V-linux-amd64.deb.sig"
              dpkg-deb --info "../dist/AI-Security-Monitor-$V-linux-amd64.deb" | grep -E "Package|Version"
              dpkg-deb --info "../dist/AI-Security-Monitor-$V-linux-amd64.deb" | grep -q "Version: $V"
              ;;
          esac
          # 安裝檔／更新檔不該小於 1 MB（空殼或打包失敗）；簽章檔不該是空的
          for f in ../dist/*; do
            case "$f" in
              *.sig) test -s "$f" || { echo "empty signature: $f"; exit 1; } ;;
              *) test "$(wc -c < "$f")" -gt 1000000 || { echo "too small: $f"; exit 1; } ;;
            esac
          done
          ls -l ../dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  hub-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Hub image (with Claude Code and Codex CLI)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: ASA_HUB_VERSION=${{ needs.verify.outputs.version }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.LEGACY_IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ env.LEGACY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 情資使用情境固定的版本（網頁上不能改）：:<版本>-commercial 只鏡像可以商用的來源、:<版本>-noncommercial 另外鏡像只限非商用的來源。
      # 只有 ENV 不同，前面的層都從上一步的快取來。
      - name: Hub image (commercial use)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ASA_HUB_VERSION=${{ needs.verify.outputs.version }}
            INTEL_USAGE=commercial
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}-commercial
            ${{ env.IMAGE }}:commercial
          cache-from: type=gha
      - name: Hub image (non-commercial use)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ASA_HUB_VERSION=${{ needs.verify.outputs.version }}
            INTEL_USAGE=noncommercial
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}-noncommercial
            ${{ env.IMAGE }}:noncommercial
          cache-from: type=gha
      - name: Hub image (slim, no AI CLIs)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ASA_HUB_VERSION=${{ needs.verify.outputs.version }}
            AI_CLIS=
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}-slim
            ${{ env.IMAGE }}:slim
            ${{ env.LEGACY_IMAGE }}:${{ needs.verify.outputs.version }}-slim
            ${{ env.LEGACY_IMAGE }}:slim
          cache-from: type=gha

  # 防護 DNS 映像：直接用上面建好的 Linux musl 靜態執行檔（x64＋arm64），FROM scratch
  dns-image:
    needs: [verify, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-linux-*
          path: artifacts
      - name: Stage binaries
        run: |
          set -euo pipefail
          V=${{ needs.verify.outputs.version }}
          mkdir -p dist/dns/amd64 dist/dns/arm64
          cp "artifacts/agent-linux-x64/ai-security-monitor-$V-linux-x64" dist/dns/amd64/ai-security-monitor
          cp "artifacts/agent-linux-arm64/ai-security-monitor-$V-linux-arm64" dist/dns/arm64/ai-security-monitor
          chmod +x dist/dns/*/ai-security-monitor
          ls -l dist/dns/*
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Protective DNS image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dns
          platforms: linux/amd64,linux/arm64
          build-args: ASA_VERSION=${{ needs.verify.outputs.version }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.DNS_IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ env.DNS_IMAGE }}:latest

  release:
    needs: [verify, agent, desktop, hub-image, dns-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          # 只拿 agent 執行檔（build-push-action 另外會上傳 .dockerbuild 紀錄）
          pattern: agent-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: desktop-*
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Updater manifest (latest.json, signatures verified against the app's public key)
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          node scripts/updater-manifest.mjs "$V" dist
          node -e "const m=require('./dist/latest.json'); for (const k of ['windows-x86_64-nsis','darwin-aarch64-app','darwin-x86_64-app','linux-x86_64-appimage']) if (!m.platforms[k]) { console.error('missing', k); process.exit(1) } console.log(JSON.stringify(m, (k, v) => k === 'signature' ? v.slice(0, 24) + '…' : v, 2))"
          # 簽章已經寫進 latest.json，不另外發佈
          rm -f dist/*.sig
      - name: Checksums and notes
        run: |
          set -euo pipefail
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          # 新名與舊名別名各六個，內容相同
          test "$(ls dist/ai-security-monitor-* | wc -l)" = 6
          test "$(ls dist/asa-* | wc -l)" = 6
          for f in dist/asa-*; do cmp "$f" "dist/ai-security-monitor-${f#dist/asa-}"; done
          # 桌面版安裝檔：Windows setup.exe、macOS arm64／x64 dmg、Linux AppImage／deb；macOS 的自動更新檔 .app.tar.gz；latest.json
          V="${{ needs.verify.outputs.version }}"
          for a in windows-x64-setup.exe macos-arm64.dmg macos-x64.dmg linux-x64.AppImage linux-amd64.deb macos-arm64.app.tar.gz macos-x64.app.tar.gz; do
            test -f "dist/AI-Security-Monitor-$V-$a"
            grep -q "  AI-Security-Monitor-$V-$a\$" dist/SHA256SUMS
          done
          test "$(ls dist/AI-Security-Monitor-* | wc -l)" = 7
          grep -q "  latest.json\$" dist/SHA256SUMS
          # 安裝腳本照檔名精確比對 SHA256SUMS：多出來的桌面版行不影響
          for a in linux-x64 macos-arm64 windows-x64.exe; do
            test "$(awk -v n="ai-security-monitor-$V-$a" '{ f = $2; sub(/^\*/, "", f); if (f == n) print $1 }' dist/SHA256SUMS | wc -l)" = 1
          done
          # Release 說明：這版重點、該下載哪個檔（依實際資產名）、安裝與升級、CHANGELOG（dry run 也產生，方便先檢查）
          node scripts/release-notes.mjs "$V" dist > notes.md
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
      - name: Create GitHub Release
        if: env.PUBLISH == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest
