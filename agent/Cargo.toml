[package]
name = "ai-security-monitor"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "AI Security Monitor (ai-security-monitor): defensive endpoint monitor with threat-intel verdicts, firewall actions, traffic/event analysis and MCP"
repository = "https://github.com/markku636/ai-security-monitor"
default-run = "ai-security-monitor"

[lib]
name = "asa_lib"
path = "src/lib.rs"

[[bin]]
name = "ai-security-monitor"
path = "src/bin/ai-security-monitor.rs"

[features]
default = ["intel", "firewall", "vuln", "hardening", "traffic", "events", "keychain", "dns-server"]
intel = []
firewall = []
vuln = []
hardening = []
traffic = []
# Live packet capture links libpcap / Npcap at build and run time; off by default.
capture = ["traffic"]
events = []
# OS keychain for secrets (Windows Credential Manager / macOS Keychain). Off → file store (0600).
keychain = ["dep:keyring"]
service = []
yara = []
sigma = []
# 防護 DNS 伺服器（ai-security-monitor dns-server）；桌面版不帶。
dns-server = ["dep:moka", "dep:arc-swap"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "io-std", "net", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
async-trait = "0.1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
include_dir = "0.7"
ipnet = { version = "2", features = ["serde"] }
humantime = "2"
comfy-table = "8"
globset = "0.4"
hostname = "0.4"
keyring = { version = "3", default-features = false, optional = true }
netstat2 = "0.11"
sysinfo = "0.39"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "stream", "http2"] }
flate2 = "1"
maxminddb = "0.32"
base64 = "0.22"
etherparse = "0.21"
pcap-parser = "0.17"
quick-xml = "0.42"
regex = "1"
serde_yaml_ng = "0.10"
# Hub discovery: mDNS/DNS-SD browse + `hub advertise` responder (pure Rust, no async runtime).
mdns-sd = { version = "0.21", default-features = false }
# Ed25519 verification of the Hub identity (already in the tree via rustls).
ring = "0.17"
socket2 = { version = "0.6", features = ["all"] }
moka = { version = "0.12", default-features = false, features = ["sync"], optional = true }
arc-swap = { version = "1.9", optional = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
keyring = { version = "3", default-features = false, features = ["windows-native"], optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Power", "Win32_System_Diagnostics_Etw", "Win32_System_Time", "Win32_System_IO"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
keyring = { version = "3", default-features = false, features = ["apple-native"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 16

[profile.dev.package.sha2]
opt-level = 3
