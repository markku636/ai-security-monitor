<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Security Monitor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <img src="icon.png" alt="" class="splash-logo" draggable="false" />
      <div class="splash-name">AI Security Monitor</div>
    </div>
    <div class="shell">
      <aside class="side">
        <div class="brand">
          <img src="icon.png" alt="" width="56" height="56" />
          <div>
            <div class="brand-name">AI Security Monitor</div>
            <div class="brand-sub" id="brand-host">本機</div>
          </div>
        </div>
        <nav id="nav">
          <div class="nav-group">要看的事</div>
          <a href="#overview" data-page="overview"><span class="ic">◎</span><span><b>總覽</b><small>分數、問題數、情資新舊</small></span></a>
          <a href="#connections" data-page="connections"><span class="ic">⇄</span><span><b>連線</b><small>這台電腦正在連哪裡、哪些可疑</small></span></a>
          <a href="#dns" data-page="dns" title="這台電腦查了哪些網域、是哪個程式查的、哪些可疑；有沒有用公司的防護 DNS"><span class="ic">⌕</span><span><b>DNS</b><small>查了哪些網域、哪些可疑</small></span></a>
          <a href="#traffic" data-page="traffic" title="用圖表看這台電腦的網路速度、哪個程式在用網路，以及 CPU、記憶體、磁碟：即時（每秒）、最近 1 小時、最近 24 小時"><span class="ic">≋</span><span><b>流量與效能</b><small>即時、各程式流量、CPU、記憶體</small></span></a>
          <a href="#findings" data-page="findings"><span class="ic">!</span><span><b>掃描結果</b><small>漏洞、設定、事件找到的問題</small></span></a>
          <div class="nav-group">工具</div>
          <a href="#intel" data-page="intel"><span class="ic">⛨</span><span><b>威脅情資</b><small>情資來源與更新</small></span></a>
          <a href="#ai" data-page="ai"><span class="ic">✦</span><span><b>AI 分析</b><small>用本機的 Claude Code／Codex 解讀</small></span></a>
          <a href="#settings" data-page="settings"><span class="ic">⚙</span><span><b>設定</b><small>加入公司 Hub、背景服務、自動更新</small></span></a>
        </nav>
        <div class="side-foot" id="side-foot"></div>
      </aside>
      <main id="main"></main>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script src="splash.js"></script>
    <script src="update-upload.js"></script>
    <script src="hub-join.js"></script>
    <script src="chart.js"></script>
    <script src="usage.js"></script>
    <script src="markdown.js"></script>
    <script src="app.js"></script>
  </body>
</html>
