# 伺服器版＋防護 DNS：compose.yml 的 Hub＋PostgreSQL，再多一台防護 DNS 伺服器。不要防護 DNS 就用 compose.yml。
#   .env 另外設 AI_SECURITY_MONITOR_HUB_DNS_TOKEN（至少 32 字元，Hub 與 dns 共用，例 openssl rand -hex 24）
#   docker compose -f docker/compose.dns.yml --env-file .env up -d
# 和 compose.yml 是同一個專案（同名、同一份資料），兩份之間隨時可以換；
# 換回不含防護 DNS 的那份時加 --remove-orphans 把 dns 容器收掉。
# 封鎖開關、上游與清單在 Hub「設定與金鑰 → 防護 DNS」（預設關＝只轉送，正在用它的裝置不會斷網）。
# dns 只發布到 AI_SECURITY_MONITOR_HUB_DNS_BIND（預設 127.0.0.1＝只有這台；給區網用改成這台的區網 IP——0.0.0.0:53 常被
# 系統的 DNS 服務佔走：Linux 的 systemd-resolved、Windows 的網際網路連線共用）。
# bridge 網路看不到裝置的真實 IP（Docker Desktop 全部變成同一個位址）；Linux 要分裝置請再加 -f docker/compose.dns-host.yml。
# 需要 Docker Compose 2.20 以上（include）。
name: asa-hub

include:
  - compose.yml

services:
  dns:
    image: ghcr.io/markku636/ai-security-monitor-dns:${AI_SECURITY_MONITOR_DNS_IMAGE_TAG:-${AI_SECURITY_MONITOR_HUB_IMAGE_TAG:-${ASA_HUB_IMAGE_TAG:-latest}}}
    restart: unless-stopped
    depends_on:
      - hub
    environment:
      AI_SECURITY_MONITOR_DNS_HUB_URL: http://hub:3000
      AI_SECURITY_MONITOR_HUB_DNS_TOKEN: ${AI_SECURITY_MONITOR_HUB_DNS_TOKEN:?請在 .env 設 AI_SECURITY_MONITOR_HUB_DNS_TOKEN（至少 32 字元，例 openssl rand -hex 24）}
    # 容器內走 compose 網路連 Hub（http 只在這個內部網路上）
    command: ["--insecure-http"]
    ports:
      - "${AI_SECURITY_MONITOR_HUB_DNS_BIND:-127.0.0.1}:${AI_SECURITY_MONITOR_HUB_DNS_PORT:-53}:53/udp"
      - "${AI_SECURITY_MONITOR_HUB_DNS_BIND:-127.0.0.1}:${AI_SECURITY_MONITOR_HUB_DNS_PORT:-53}:53/tcp"
    volumes:
      - dnsdata:/data

volumes:
  dnsdata: {}
