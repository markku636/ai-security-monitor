# Linux：防護 DNS 改用 host 網路，看得到每個裝置的真實 IP（依裝置篩選紀錄、對到主機）。
#   docker compose -f docker/compose.yml -f docker/compose.dns-host.yml --env-file .env --profile dns up -d
# host 網路下連 Hub 走這台發布的 port；監聽 0.0.0.0:53 與 [::]:53，被 systemd-resolved 佔住時自動改綁各網卡的位址。
# Docker Desktop（Windows／macOS）的 host 網路不是真的主機網路，請改用原生的 ai-security-monitor dns-server。
services:
  dns:
    network_mode: host
    # host 網路套用主機的 port 規則（1024 以下要 root），容器內的 nobody 綁不了 53
    user: "0:0"
    ports: !reset []
    environment:
      AI_SECURITY_MONITOR_DNS_HUB_URL: http://127.0.0.1:${AI_SECURITY_MONITOR_HUB_HOST_PORT:-8088}
