# 單機版：Hub＋PostgreSQL 只給這台電腦用（只綁 127.0.0.1），本機的 ai-security-monitor 回報到 http://127.0.0.1:8088。
#   cp .env.example .env   # 填好 AI_SECURITY_MONITOR_HUB_ADMIN_SECRET、AI_SECURITY_MONITOR_HUB_DB_PASSWORD
#   docker compose -f docker/compose.standalone.yml --env-file .env up -d
#   ai-security-monitor enroll http://127.0.0.1:8088 --key <在 Hub「新增主機」頁建立的註冊金鑰>
# 變數先讀 AI_SECURITY_MONITOR_HUB_*，沒設才讀舊名 ASA_HUB_*（0.1.x 的 .env 不用改）。
# 管理員金鑰與資料庫密碼必填：沒設時 Hub 容器會拒絕啟動（docker compose logs hub 看原因）。
# 專案名、volume 與資料庫名稱 asa_hub 刻意不改，升級後資料原地沿用。
name: asa-hub-standalone

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asa_hub
      POSTGRES_USER: asa_hub
      POSTGRES_PASSWORD: ${AI_SECURITY_MONITOR_HUB_DB_PASSWORD:-${ASA_HUB_DB_PASSWORD:-}}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asa_hub -d asa_hub"]
      interval: 5s
      timeout: 3s
      retries: 30

  hub:
    image: ghcr.io/markku636/ai-security-monitor-hub:${AI_SECURITY_MONITOR_HUB_IMAGE_TAG:-${ASA_HUB_IMAGE_TAG:-latest}}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AI_SECURITY_MONITOR_HUB_DATABASE_URL: postgres://asa_hub:${AI_SECURITY_MONITOR_HUB_DB_PASSWORD:-${ASA_HUB_DB_PASSWORD:-}}@postgres:5432/asa_hub
      AI_SECURITY_MONITOR_HUB_ADMIN_SECRET: ${AI_SECURITY_MONITOR_HUB_ADMIN_SECRET:-${ASA_HUB_ADMIN_SECRET:-}}
      AI_SECURITY_MONITOR_HUB_CLIENT_SECRETS: ${AI_SECURITY_MONITOR_HUB_CLIENT_SECRETS:-${ASA_HUB_CLIENT_SECRETS:-}}
      AI_SECURITY_MONITOR_HUB_PUBLIC_URL: ${AI_SECURITY_MONITOR_HUB_PUBLIC_URL:-${ASA_HUB_PUBLIC_URL:-http://127.0.0.1:${AI_SECURITY_MONITOR_HUB_HOST_PORT:-${ASA_HUB_HOST_PORT:-8088}}}}
      AI_SECURITY_MONITOR_HUB_EDITION: standalone
      AI_SECURITY_MONITOR_HUB_MCP_TOKEN: ${AI_SECURITY_MONITOR_HUB_MCP_TOKEN:-${ASA_HUB_MCP_TOKEN:-}}
      AI_SECURITY_MONITOR_HUB_ENROLL_REQUESTS: ${AI_SECURITY_MONITOR_HUB_ENROLL_REQUESTS:-}
      AI_SECURITY_MONITOR_HUB_NAME: ${AI_SECURITY_MONITOR_HUB_NAME:-}
      AI_SECURITY_MONITOR_HUB_UPDATE_CHECK: ${AI_SECURITY_MONITOR_HUB_UPDATE_CHECK:-${ASA_HUB_UPDATE_CHECK:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # IP 外部情資（選填；也可在「設定與金鑰 → 外部情資來源」設定）
      AI_SECURITY_MONITOR_HUB_ABUSEIPDB_KEY: ${AI_SECURITY_MONITOR_HUB_ABUSEIPDB_KEY:-${ASA_HUB_ABUSEIPDB_KEY:-}}
      AI_SECURITY_MONITOR_HUB_IPINFO_TOKEN: ${AI_SECURITY_MONITOR_HUB_IPINFO_TOKEN:-${ASA_HUB_IPINFO_TOKEN:-}}
      AI_SECURITY_MONITOR_HUB_PROXYCHECK_KEY: ${AI_SECURITY_MONITOR_HUB_PROXYCHECK_KEY:-${ASA_HUB_PROXYCHECK_KEY:-}}
      AI_SECURITY_MONITOR_HUB_GREYNOISE_KEY: ${AI_SECURITY_MONITOR_HUB_GREYNOISE_KEY:-${ASA_HUB_GREYNOISE_KEY:-}}
      AI_SECURITY_MONITOR_HUB_IP_LOOKUPS: ${AI_SECURITY_MONITOR_HUB_IP_LOOKUPS:-${ASA_HUB_IP_LOOKUPS:-}}
      # 流量／效能保留天數（空白＝原始樣本 7 天、每小時彙總 90 天）
      AI_SECURITY_MONITOR_HUB_METRICS_RAW_DAYS: ${AI_SECURITY_MONITOR_HUB_METRICS_RAW_DAYS:-${ASA_HUB_METRICS_RAW_DAYS:-}}
      AI_SECURITY_MONITOR_HUB_METRICS_HOURLY_DAYS: ${AI_SECURITY_MONITOR_HUB_METRICS_HOURLY_DAYS:-${ASA_HUB_METRICS_HOURLY_DAYS:-}}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
    ports:
      - "127.0.0.1:${AI_SECURITY_MONITOR_HUB_HOST_PORT:-${ASA_HUB_HOST_PORT:-8088}}:3000"
    volumes:
      - hubdata:/data

volumes:
  pgdata: {}
  hubdata: {}
