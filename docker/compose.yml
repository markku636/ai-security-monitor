# 伺服器版：Security Hub＋PostgreSQL，給整個車隊的 agent 回報。
#   cp .env.example .env   # 填好 AI_SECURITY_MONITOR_HUB_ADMIN_SECRET、AI_SECURITY_MONITOR_HUB_DB_PASSWORD
#   docker compose -f docker/compose.yml --env-file .env up -d
# 更新：docker compose -f docker/compose.yml --env-file .env pull && docker compose -f docker/compose.yml --env-file .env up -d
# 變數先讀 AI_SECURITY_MONITOR_HUB_*，沒設才讀舊名 ASA_HUB_*（0.1.x 的 .env 不用改）。
# 管理員金鑰與資料庫密碼必填：沒設時 Hub 容器會拒絕啟動（docker compose logs hub 看原因）。
# 專案名、volume 與資料庫名稱 asa_hub 刻意不改，升級後資料原地沿用。
name: asa-hub

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asa_hub
      POSTGRES_USER: asa_hub
      POSTGRES_PASSWORD: ${AI_SECURITY_MONITOR_HUB_DB_PASSWORD:-${ASA_HUB_DB_PASSWORD:-}}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asa_hub -d asa_hub"]
      interval: 5s
      timeout: 3s
      retries: 30

  hub:
    image: ghcr.io/markku636/ai-security-monitor-hub:${AI_SECURITY_MONITOR_HUB_IMAGE_TAG:-${ASA_HUB_IMAGE_TAG:-latest}}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    init: false
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AI_SECURITY_MONITOR_HUB_DATABASE_URL: postgres://asa_hub:${AI_SECURITY_MONITOR_HUB_DB_PASSWORD:-${ASA_HUB_DB_PASSWORD:-}}@postgres:5432/asa_hub
      AI_SECURITY_MONITOR_HUB_ADMIN_SECRET: ${AI_SECURITY_MONITOR_HUB_ADMIN_SECRET:-${ASA_HUB_ADMIN_SECRET:-}}
      AI_SECURITY_MONITOR_HUB_CLIENT_SECRETS: ${AI_SECURITY_MONITOR_HUB_CLIENT_SECRETS:-${ASA_HUB_CLIENT_SECRETS:-}}
      AI_SECURITY_MONITOR_HUB_PUBLIC_URL: ${AI_SECURITY_MONITOR_HUB_PUBLIC_URL:-${ASA_HUB_PUBLIC_URL:-}}
      AI_SECURITY_MONITOR_HUB_EDITION: ${AI_SECURITY_MONITOR_HUB_EDITION:-${ASA_HUB_EDITION:-server}}
      AI_SECURITY_MONITOR_HUB_PUBLIC_DASHBOARD: ${AI_SECURITY_MONITOR_HUB_PUBLIC_DASHBOARD:-${ASA_HUB_PUBLIC_DASHBOARD:-}}
      AI_SECURITY_MONITOR_HUB_TRUST_PROXY: ${AI_SECURITY_MONITOR_HUB_TRUST_PROXY:-${ASA_HUB_TRUST_PROXY:-}}
      AI_SECURITY_MONITOR_HUB_MCP_TOKEN: ${AI_SECURITY_MONITOR_HUB_MCP_TOKEN:-${ASA_HUB_MCP_TOKEN:-}}
      AI_SECURITY_MONITOR_HUB_ENROLL_REQUESTS: ${AI_SECURITY_MONITOR_HUB_ENROLL_REQUESTS:-}
      AI_SECURITY_MONITOR_HUB_ENROLL_MODE: ${AI_SECURITY_MONITOR_HUB_ENROLL_MODE:-}
      AI_SECURITY_MONITOR_HUB_NAME: ${AI_SECURITY_MONITOR_HUB_NAME:-}
      # 區網 mDNS 廣播（預設開）；bridge 網路的廣播出不了區網，見 docs/enrollment.md
      AI_SECURITY_MONITOR_HUB_MDNS: ${AI_SECURITY_MONITOR_HUB_MDNS:-}
      # 主機上綁的位址（和下面 ports 同一個值）：Hub「新增主機」頁用它判斷辦公室其他電腦連不連得到
      AI_SECURITY_MONITOR_HUB_BIND: ${AI_SECURITY_MONITOR_HUB_BIND:-${ASA_HUB_BIND:-0.0.0.0}}
      AI_SECURITY_MONITOR_HUB_ACTION_SIGNING_KEY: ${AI_SECURITY_MONITOR_HUB_ACTION_SIGNING_KEY:-${ASA_HUB_ACTION_SIGNING_KEY:-}}
      AI_SECURITY_MONITOR_HUB_UPDATE_CHECK: ${AI_SECURITY_MONITOR_HUB_UPDATE_CHECK:-${ASA_HUB_UPDATE_CHECK:-}}
      AI_SECURITY_MONITOR_HUB_AI_MAX_CONCURRENT: ${AI_SECURITY_MONITOR_HUB_AI_MAX_CONCURRENT:-${ASA_HUB_AI_MAX_CONCURRENT:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # IP 外部情資（選填；也可在「設定與金鑰 → 外部情資來源」設定）
      AI_SECURITY_MONITOR_HUB_ABUSEIPDB_KEY: ${AI_SECURITY_MONITOR_HUB_ABUSEIPDB_KEY:-${ASA_HUB_ABUSEIPDB_KEY:-}}
      AI_SECURITY_MONITOR_HUB_IPINFO_TOKEN: ${AI_SECURITY_MONITOR_HUB_IPINFO_TOKEN:-${ASA_HUB_IPINFO_TOKEN:-}}
      AI_SECURITY_MONITOR_HUB_PROXYCHECK_KEY: ${AI_SECURITY_MONITOR_HUB_PROXYCHECK_KEY:-${ASA_HUB_PROXYCHECK_KEY:-}}
      AI_SECURITY_MONITOR_HUB_GREYNOISE_KEY: ${AI_SECURITY_MONITOR_HUB_GREYNOISE_KEY:-${ASA_HUB_GREYNOISE_KEY:-}}
      AI_SECURITY_MONITOR_HUB_VIRUSTOTAL_KEY: ${AI_SECURITY_MONITOR_HUB_VIRUSTOTAL_KEY:-${ASA_HUB_VIRUSTOTAL_KEY:-}}
      AI_SECURITY_MONITOR_HUB_OTX_KEY: ${AI_SECURITY_MONITOR_HUB_OTX_KEY:-${ASA_HUB_OTX_KEY:-}}
      AI_SECURITY_MONITOR_HUB_HACKERTARGET_KEY: ${AI_SECURITY_MONITOR_HUB_HACKERTARGET_KEY:-${ASA_HUB_HACKERTARGET_KEY:-}}
      AI_SECURITY_MONITOR_HUB_SECRETS_KEY: ${AI_SECURITY_MONITOR_HUB_SECRETS_KEY:-${ASA_HUB_SECRETS_KEY:-}}
      AI_SECURITY_MONITOR_HUB_IP_LOOKUPS: ${AI_SECURITY_MONITOR_HUB_IP_LOOKUPS:-${ASA_HUB_IP_LOOKUPS:-}}
      # 流量／效能保留天數（空白＝原始樣本 7 天、每小時彙總 90 天）
      AI_SECURITY_MONITOR_HUB_METRICS_RAW_DAYS: ${AI_SECURITY_MONITOR_HUB_METRICS_RAW_DAYS:-${ASA_HUB_METRICS_RAW_DAYS:-}}
      AI_SECURITY_MONITOR_HUB_METRICS_HOURLY_DAYS: ${AI_SECURITY_MONITOR_HUB_METRICS_HOURLY_DAYS:-${ASA_HUB_METRICS_HOURLY_DAYS:-}}
      AI_SECURITY_MONITOR_HUB_DNS_RAW_DAYS: ${AI_SECURITY_MONITOR_HUB_DNS_RAW_DAYS:-}
      AI_SECURITY_MONITOR_HUB_DNS_HOURLY_DAYS: ${AI_SECURITY_MONITOR_HUB_DNS_HOURLY_DAYS:-}
      AI_SECURITY_MONITOR_HUB_DNS_TOKEN: ${AI_SECURITY_MONITOR_HUB_DNS_TOKEN:-}
      AI_SECURITY_MONITOR_HUB_AI_RETENTION_DAYS: ${AI_SECURITY_MONITOR_HUB_AI_RETENTION_DAYS:-}
      AI_SECURITY_MONITOR_HUB_IPINTEL_CACHE_DAYS: ${AI_SECURITY_MONITOR_HUB_IPINTEL_CACHE_DAYS:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
    ports:
      - "${AI_SECURITY_MONITOR_HUB_BIND:-${ASA_HUB_BIND:-0.0.0.0}}:${AI_SECURITY_MONITOR_HUB_HOST_PORT:-${ASA_HUB_HOST_PORT:-8088}}:3000"
    volumes:
      - hubdata:/data

  # 防護 DNS（選用，預設不起）：.env 設好 AI_SECURITY_MONITOR_HUB_DNS_TOKEN（至少 32 字元，Hub 與 dns 共用）後
  #   docker compose -f docker/compose.yml --env-file .env --profile dns up -d
  # 封鎖開關、上游與清單在 Hub「設定與金鑰 → 防護 DNS」（預設關＝只轉送）。
  # 只發布到 AI_SECURITY_MONITOR_HUB_DNS_BIND（預設 127.0.0.1；給區網用請改成這台的區網 IP——0.0.0.0:53 常被
  # 系統的 DNS 服務佔走：Linux 的 systemd-resolved、Windows 的網際網路連線共用）。
  # bridge 網路看不到裝置的真實 IP（Docker Desktop 全部變成同一個位址）；Linux 要分裝置請再加 -f docker/compose.dns-host.yml。
  dns:
    image: ghcr.io/markku636/ai-security-monitor-dns:${AI_SECURITY_MONITOR_DNS_IMAGE_TAG:-${AI_SECURITY_MONITOR_HUB_IMAGE_TAG:-latest}}
    profiles: [dns]
    restart: unless-stopped
    depends_on:
      - hub
    environment:
      AI_SECURITY_MONITOR_DNS_HUB_URL: http://hub:3000
      AI_SECURITY_MONITOR_HUB_DNS_TOKEN: ${AI_SECURITY_MONITOR_HUB_DNS_TOKEN:-}
    # 容器內走 compose 網路連 Hub（http 只在這個內部網路上）
    command: ["--insecure-http"]
    ports:
      - "${AI_SECURITY_MONITOR_HUB_DNS_BIND:-127.0.0.1}:${AI_SECURITY_MONITOR_HUB_DNS_PORT:-53}:53/udp"
      - "${AI_SECURITY_MONITOR_HUB_DNS_BIND:-127.0.0.1}:${AI_SECURITY_MONITOR_HUB_DNS_PORT:-53}:53/tcp"
    volumes:
      - dnsdata:/data

volumes:
  dnsdata: {}
  pgdata: {}
  hubdata: {}
